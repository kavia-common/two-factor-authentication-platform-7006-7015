<div class="auth-shell">
  <div class="auth-card">
    <div class="brand">
      <div class="dot"></div>
      <h1>Welcome back</h1>
    </div>
    <p class="subtitle">Sign in to continue to your dashboard</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="w-100 field">
        <label for="email">Email</label>
        <input id="email" class="input" placeholder="you@example.com" formControlName="email" type="email" required />
        <small class="error" *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">Email is required</small>
        <small class="error" *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">Enter a valid email</small>
      </div>

      <div class="w-100 field">
        <label for="password">Password</label>
        <div class="password">
          <input id="password" class="input" [type]="hide() ? 'password' : 'text'" formControlName="password" required />
          <button type="button" class="icon-btn" (click)="hide.set(!hide())" [attr.aria-label]="'Toggle password visibility'">
            <span class="material-icons">{{ hide() ? 'visibility' : 'visibility_off' }}</span>
          </button>
        </div>
        <small class="error" *ngIf="form.controls.password.touched && form.controls.password.hasError('required')">Password is required</small>
      </div>

      <div *ngIf="error()" style="color:#EF4444; font-size: 13px; margin-bottom: 10px;">
        {{ error() }}
      </div>

      <button class="primary w-100" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="footer-note">
      Protected by two-factor authentication
    </div>
  </div>
</div>
